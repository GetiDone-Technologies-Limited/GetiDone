version: '3.8'

services:
  # PostgreSQL Database Service
  postgres:
    image: postgres:16-alpine
    container_name: getidone-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: getidone_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # NestJS Backend Microservice
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: getidone-backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://postgres:password123@postgres:5432/getidone_db?schema=public"
      PORT: 3000
      JWT_SECRET: "getidone_super_secret_jwt_key_2026"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
