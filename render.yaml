services:
  # ----------------------------------------------------
  # 1. BACKEND SERVICE (NestJS + Prisma + Socket.io)
  # ----------------------------------------------------
  - type: web
    name: getidone-backend
    runtime: node
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    startCommand: (npx prisma db push --accept-data-loss || true) && node dist/main.js
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: SUPABASE_URL
        value: https://ueacqckeqnunrnqipjpa.supabase.co
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: OPENAI_API_KEY
        value: ""
      - key: OPENROUTER_API_KEY
        value: ""
      - key: ZHIPU_API_KEY
        value: ""

  # ----------------------------------------------------
  # 2. FRONTEND SERVICE (Next.js 15)
  # ----------------------------------------------------
  - type: web
    name: getidone-frontend
    runtime: node
    rootDir: frontend
    plan: free
    region: oregon
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: BACKEND_INTERNAL_URL
        fromService:
          type: web
          name: getidone-backend
          property: host
      - key: NEXT_PUBLIC_API_URL
        value: https://getidone-backend.onrender.com/api
      - key: NEXT_PUBLIC_SOCKET_URL
        value: https://getidone-backend.onrender.com
      - key: NEXT_PUBLIC_SUPABASE_URL
        value: https://ueacqckeqnunrnqipjpa.supabase.co
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
