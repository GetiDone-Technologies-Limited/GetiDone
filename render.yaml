databases:
  - name: getidone-db
    databaseName: getidone
    user: getidone
    plan: free
    region: oregon
    ipAllowList:
      - source: 74.220.48.0/24
        description: Render Outbound Network 1
      - source: 74.220.56.0/24
        description: Render Outbound Network 2
      - source: 0.0.0.0/0
        description: Public connections

services:
  # ----------------------------------------------------
  # 1. BACKEND SERVICE (NestJS + Prisma + Socket.io)
  # ----------------------------------------------------
  - type: web
    name: getidone-backend
    runtime: node
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    startCommand: npx prisma db push --accept-data-loss && node dist/main.js
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: getidone-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: OPENAI_API_KEY
        value: ""
      - key: OPENROUTER_API_KEY
        value: ""
      - key: ZHIPU_API_KEY
        value: ""

  # ----------------------------------------------------
  # 2. FRONTEND SERVICE (Next.js 15)
  # ----------------------------------------------------
  - type: web
    name: getidone-frontend
    runtime: node
    rootDir: frontend
    plan: free
    region: oregon
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start -- -p 10000
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: BACKEND_INTERNAL_URL
        fromService:
          type: web
          name: getidone-backend
          property: host
      - key: NEXT_PUBLIC_API_URL
        value: https://getidone-backend.onrender.com/api
      - key: NEXT_PUBLIC_SOCKET_URL
        value: https://getidone-backend.onrender.com
