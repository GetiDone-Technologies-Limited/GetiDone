name: GetiDone CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ----------------------------------------------------
  # Job 1: Frontend Type-Check & Build
  # ----------------------------------------------------
  frontend-check:
    name: Frontend Type-Check & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: TypeScript Type-Check
        run: |
          cd frontend
          npx tsc --noEmit

  # ----------------------------------------------------
  # Job 2: Backend Build & Prisma Verification
  # ----------------------------------------------------
  backend-check:
    name: Backend Build & Prisma Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci

      - name: Generate Prisma Client
        run: |
          cd backend
          npx prisma generate

      - name: Build NestJS Application
        run: |
          cd backend
          npm run build

  # ----------------------------------------------------
  # Job 3: E2E Verification Test Suite Execution
  # ----------------------------------------------------
  e2e-tests:
    name: Run E2E Test Suite (71 Tests)
    runs-on: ubuntu-latest
    needs: [frontend-check, backend-check]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          cd backend && npm ci && cd ..
          cd frontend && npm ci && cd ..

      - name: Run 71 E2E Integration Tests
        run: |
          PORT=3005 node tests/e2e/runner.js

  # ----------------------------------------------------
  # Job 4: Docker Container Build Verification
  # ----------------------------------------------------
  docker-build:
    name: Verify Docker Container Build
    runs-on: ubuntu-latest
    needs: [e2e-tests]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        run: |
          docker build -t getidone-backend ./backend
