<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loading — GetiDone</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="https://z-cdn-media.chatglm.cn/files/ff6aace7-1d03-429f-8d3c-4a7e8d8aed5e.png" type="image/png">
<style>
  :root {
    --bg: #0A0F0D;
    --primary: #10B981;
    --primary-light: #34D399;
    --text: #FFFFFF;
    --muted: #7A8A82;
  }
  
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  body {
    font-family: 'Manrope', sans-serif;
    background-color: var(--bg);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
  }
  
  /* Ambient Background Glow */
  body::before {
    content: '';
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(16, 185, 129, 0.15) 0%, transparent 70%);
    filter: blur(80px);
    z-index: 0;
    animation: pulse-glow 2s infinite ease-in-out;
  }
  
  @keyframes pulse-glow {
    0%, 100% { opacity: 0.4; transform: translate(-50%, -50%) scale(1); }
    50% { opacity: 0.8; transform: translate(-50%, -50%) scale(1.1); }
  }
  
  .loader-container {
    position: relative;
    z-index: 1;
    text-align: center;
    width: 100%;
    max-width: 320px;
    padding: 0 20px;
    /* Fade out control */
    opacity: 1;
    transition: opacity 0.5s ease;
  }
  
  .loader-container.loaded {
    opacity: 0;
  }
  
  /* Logo Animation */
  .logo-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 40px;
  }
  
  .logo-icon {
    width: 70px;
    height: 70px;
    background: linear-gradient(135deg, var(--primary), var(--primary-light));
    border-radius: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 28px;
    margin-bottom: 24px;
    box-shadow: 0 10px 30px rgba(16, 185, 129, 0.4);
    animation: bounce-arrow 1.2s infinite cubic-bezier(0.4, 0, 0.2, 1);
  }
  
  @keyframes bounce-arrow {
    0%, 100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-8px) scale(1.05); }
  }
  
  .logo-text {
    font-family: 'Sora', sans-serif;
    font-weight: 800;
    font-size: 32px;
    letter-spacing: -0.02em;
    opacity: 0;
    animation: fade-in-up 0.6s 0.2s forwards;
  }
  
  .logo-text .geti { color: var(--text); }
  .logo-text .done { color: var(--primary); }
  
  @keyframes fade-in-up {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  
  /* Progress Bar */
  .progress-track {
    width: 100%;
    height: 4px;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 100px;
    overflow: hidden;
    margin-bottom: 16px;
  }
  
  .progress-fill {
    width: 0%;
    height: 100%;
    background: linear-gradient(90deg, var(--primary), var(--primary-light));
    border-radius: 100px;
    animation: load-swift 1.4s 0.3s cubic-bezier(0.4, 0, 0.2, 1) forwards;
  }
  
  @keyframes load-swift {
    0% { width: 0%; }
    50% { width: 70%; }
    100% { width: 100%; }
  }
  
  /* Loading Text */
  .status-text {
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    letter-spacing: 1px;
    text-transform: uppercase;
    opacity: 0;
    animation: fade-in-up 0.6s 0.4s forwards;
  }
  
  /* Dot animation for text */
  .dots::after {
    content: '';
    animation: dots 1.5s steps(4, end) infinite;
  }
  
  @keyframes dots {
    0%, 20% { content: ''; }
    40% { content: '.'; }
    60% { content: '..'; }
    80%, 100% { content: '...'; }
  }
</style>
</head>
<body>

<div class="loader-container" id="loader">
  <div class="logo-wrapper">
    <div class="logo-icon">
      <i class="fa-solid fa-arrow-up"></i>
    </div>
    <div class="logo-text">
      <span class="geti">Geti</span><span class="done">Done</span>
    </div>
  </div>
  
  <div class="progress-track">
    <div class="progress-fill"></div>
  </div>
  
  <div class="status-text">Preparing your workspace<span class="dots"></span></div>
</div>

<script>
  // Simulate a swift loading time before redirecting
  window.addEventListener('load', () => {
    setTimeout(() => {
      const loader = document.getElementById('loader');
      loader.classList.add('loaded');
      
      // Redirect after the fade-out animation completes
      setTimeout(() => {
        // Change 'dashboard.html' to whichever page you want to load next
        window.location.href = 'dashboard.html';
      }, 500); // 500ms matches the CSS transition duration
    }, 1600); // 1.6s total loading time to feel swift but allow the animation to play
  });
</script>

</body>
</html>
